<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hall of Legends</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0d0805;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* Start screen */
    #start {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at center, rgba(60, 35, 12, 0.55), rgba(8, 5, 3, 0.92));
      color: #f3d98b;
      font-family: Georgia, 'Times New Roman', serif;
      text-align: center;
      padding: 16px;
      transition: opacity 0.6s ease;
    }
    #start.hide {
      opacity: 0;
      pointer-events: none;
    }
    #start .title {
      font-size: clamp(22px, 4vw, 40px);
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 16px #c9a24a;
      animation: pulse 1.8s ease-in-out infinite alternate;
    }
    #start .sub {
      font-size: clamp(13px, 1.6vw, 16px);
      color: #c9b07a;
      letter-spacing: 1px;
    }
    @keyframes pulse {
      from { opacity: 0.7; text-shadow: 0 0 8px #c9a24a; }
      to   { opacity: 1;   text-shadow: 0 0 22px #e8c56a; }
    }
    #replay {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: none;
      padding: 8px 14px;
      border: 1px solid #c9a24a;
      border-radius: 6px;
      background: rgba(18, 12, 8, 0.8);
      color: #f3d98b;
      font: 600 14px/1 Georgia, serif;
      cursor: pointer;
    }
    #replay.show { display: block; }
  </style>
</head>
<body>
  <!-- Plays once with sound after the click, then stays on the final frame (the full board). -->
  <video id="board" src="board.mp4" playsinline preload="auto"></video>

  <div id="start">
    <div class="title">⚔️ Click to see the Hall of Legends</div>
    <div class="sub">AdCraft Guild</div>
  </div>

  <button id="replay" type="button">↻ Replay</button>

  <script>
    const video = document.getElementById('board');
    const start = document.getElementById('start');
    const replay = document.getElementById('replay');

    function reveal() {
      start.classList.add('hide');
      replay.classList.remove('show');
      video.currentTime = 0;
      video.muted = false;
      video.play();
    }

    start.addEventListener('click', reveal);
    replay.addEventListener('click', (e) => {
      e.stopPropagation();
      reveal();
    });

    // When the reveal ends, it stays on the last frame and offers a replay.
    video.addEventListener('ended', () => replay.classList.add('show'));
  </script>
</body>
</html>
